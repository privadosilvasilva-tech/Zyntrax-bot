# fly.toml app configuration file generated for zyntrax-bot on 2026-09-08T18:53:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zyntrax-bot'
primary_region = 'gru'

[build]
  builder = 'dockerfile'

[env]
  DISCORD_TOKEN = ''

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
